# commitlint — PR 커밋 메시지가 Conventional Commits 규약을 따르는지 검사하는 기계 게이트.
# 배경: 커밋 컨벤션(타입 영어 feat/fix/...·본문 한국어)을 prose 규칙 대신 메커니즘으로 강제한다.
# 규약 강제는 scripts/check-commit-message.cjs가 담당한다. 단일 출처: team-harness code-review.md
# 셋업: new-repo.sh가 workflow·validator를 복사하고 'commitlint'를 required check에 등록한다.
name: commitlint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: 커밋 metadata·메시지 provenance 검사
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            git fetch --no-tags origin develop
            DEVELOP_SHA="$(git rev-parse FETCH_HEAD)"
            node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA" --exclude "$DEVELOP_SHA"
          elif [[ "$BASE_REF" = "develop" && "$HEAD_REF" == sync/backmerge-* ]]; then
            git fetch --no-tags origin main
            MAIN_SHA="$(git rev-parse FETCH_HEAD)"
            BACKMERGE_COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA" "^$MAIN_SHA" --)"
            if [ -z "$BACKMERGE_COMMITS" ]; then
              echo "main에 없는 backmerge commit이 없어 검사를 마칩니다."
            else
              node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA" --exclude "$MAIN_SHA"
            fi
          else
            node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA"
          fi
